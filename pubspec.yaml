name: ecommerce_app
description: "A complete e-commerce app with Flutter, Node.js, Stripe, and Firebase"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.0
  http: ^1.1.0
  shared_preferences: ^2.2.0
  flutter_dotenv: ^5.1.0
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  path_provider: ^2.1.0
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  easy_push_notification: ^0.0.4
  easy_stripe_payment: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - .env
